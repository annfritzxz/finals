<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reservation - GreenStay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <h2>Book Your Stay</h2>
    <form id="reservation-form" onsubmit="handleReservation(event)">
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      
      <!-- Date fields as text with placeholder and date picker on focus -->
      <input type="text" placeholder="Start of Reservation" onfocus="(this.type='date')" required />
      <input type="text" placeholder="End of Reservation" onfocus="(this.type='date')" required />
      
      <input type="number" placeholder="Number of Guests" required />
      <button type="submit" class="brown-btn">Reserve</button>
    </form>
    <p id="thank-you-message" style="display: none; color: green; margin-top: 10px;">
      Thank you for your reservation!
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
